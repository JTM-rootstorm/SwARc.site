title: SwARc
description: >-
  SwARc, the Swiss Army Recompiler: static recompilation of PC and console
  games into native programs, and the game ports built on it, by system.
repo: https://github.com/JTM-rootstorm/SwARc

markdown: kramdown
kramdown:
  input: GFM

# Systems are _systems/<name>.md; a system's ports are _projects/<name>/,
# served at /<name>/<port>/.
collections:
  systems:
    output: true
    permalink: /:name/
  projects:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      type: systems
    values:
      layout: system
  - scope:
      type: projects
    values:
      layout: project
  - scope:
      path: _projects/pc
    values:
      system: pc
  - scope:
      path: _projects/ps4
    values:
      system: ps4
  - scope:
      path: _projects/x360
    values:
      system: x360

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
